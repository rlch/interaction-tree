[package]
name = "it-tui"
version = "0.1.0"
edition = "2021"
description = "TUI client for interaction-tree-server monitoring"
license = "MIT"

[[bin]]
name = "it-tui"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
